; Overrides customizados de PHP para o GLPI (Listados).
; Carregado automaticamente pela imagem php:*-apache via /usr/local/etc/php/conf.d/.

; O default de 128M estoura ao sanitizar e-mails grandes (corpo HTML extenso,
; anexos inline) durante a coleta via MailCollector::collect() (get_mails),
; causando "Allowed memory size exhausted" em src/Toolbox/Sanitizer.php.
memory_limit = 512M
